# fly.toml app configuration file generated for boomparty on 2026-08-02T17:38:55-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'boomparty'
primary_region = 'ord'

# One always-on machine: rooms/games live in process memory, so never scale
# this horizontally, and never let the machine auto-stop mid-game.

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
