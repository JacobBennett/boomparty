# Fly.io config for boomparty.
# One always-on machine: rooms live in process memory, so never scale this
# horizontally, and never let the machine auto-stop (it would wipe live rooms).

app = "boomparty"
primary_region = "ord"

[build]
  # Uses the repo Dockerfile.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
